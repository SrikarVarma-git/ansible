- name: variables to print
  hosts: varma
  vars:
   COURSE: "DEVOPS"
   DURATION: "120HRS"
   TRAINER: "SIVAKUMAR"
  tasks:
  - name: variables printing
    ansible.builtin.debug:
     msg: "I am learning {{COURSE}} and the duration is: {{DURATION}} and trainer is: {{TRAINER}}"

  - name: variables printing again
    vars:
     COURSE: "ANSIBLE"
    ansible.builtin.debug:
     msg: "I am learning {{COURSE}} and the duration is: {{DURATION}} and trainer is: {{TRAINER}}"

- name: filters in ansible
  hosts: local
  connection: local
  # vars:
  #  course: "DevOps with AWS"
  tasks:
  - name: print the default variable
    ansible.builtin.debug:
     msg: " Hello {{ course  | default ('Ansible') }} "


  - name: print the word in upper case
    vars:
     information: "Hello Srikar"
    ansible.builtin.debug:
     msg: "{{ information | upper }}"

  - name: print the word in lower case
    vars:
     information: "Hello Srikar"
    ansible.builtin.debug:
     msg: "{{ information | lower }}"

  - name: get the unique values
    vars:
     numbers: [3,2,1,1,2,3]
    ansible.builtin.debug:
     msg: "{{ numbers | unique }}"

  - name: print min and max numbers
    vars:
     numbers: [12,24,36,48,64]
    ansible.builtin.debug:
     msg: " Min: {{ numbers | min }}, Max: {{ numbers | max }} "

  # - name: convert map to list
  #   vars:

- name: filters in ansible
  hosts: local
  connection: local
  # vars:
  #  course: "DevOps with AWS"
  tasks:
  - name: print the default variable
    ansible.builtin.debug:
     msg: " Hello {{ course  | default ('Ansible') }} "


  - name: print the word in upper case
    vars:
     information: "Hello Srikar"
    ansible.builtin.debug:
     msg: "{{ information | upper }}"

  - name: print the word in lower case
    vars:
     information: "Hello Srikar"
    ansible.builtin.debug:
     msg: "{{ information | lower }}"
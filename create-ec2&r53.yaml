- name: create ec2 instance & r53 records
  hosts: local
  connection: local
  vars:
   subnet_id: subnet-05faecd742c5b55d9
   sg_id: "sg-0e77c0eb50c90d35b"
   AMI_ID: "ami-0055977a6e828a4f4"
   instances:
   - mysql
   - backend
   - frontend
   zone: daws81s.store

  tasks:

  - name: install python libraries
    ansible.builtin.pip:
     name: 
     - botocore
     - boto3
     executable: pip3.9

  - name: create an ec2 instance
    amazon.aws.ec2_instance:
     name: "{{ item }}"
     vpc_subnet_id: "{{ subnet_id }}"
     instance_type: t3.micro
     security_group: "{{ sg_id }}"
     image_id: "{{ AMI_ID }}"
    loop: "{{ instances }}"
    register: ec2_instances


  - name: print the output
    ansible.builtin.debug:
     msg: "{{ ec2_instances }}"

  - name: create r53  private records
    amazon.aws.route53:
     state: present
     zone: "{{ zone }}"
     record:  "{{ item.item}}.{{ zone }}"                   #mysql.daws81s.store
     type: A
     ttl: 1
     value: "{{item.instances[0].private_ip_address}}"
     wait: true
     overwrite: true

    loop: "{{ ec2_instances.results }}"

  - name: create r53 public records
    amazon.aws.route53:
     state: present
     zone: "{{ zone }}"
     record:  "{{ zone }}"                   #daws81s.store
     type: A
     ttl: 1
     value: "{{item.instances[0].public_ip_address}}"
     wait: true
     overwrite: true

    loop: "{{ ec2_instances.results }}"
    when: item.item == "frontend"